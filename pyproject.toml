[project]
name = "v-si"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "a2a-sdk[fastapi,http-server,telemetry,postgresql]==1.1.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "opentelemetry-instrumentation-fastapi",
  "opentelemetry-instrumentation-httpx",
  "opentelemetry-exporter-otlp",
  "bandit>=1.7.0",
  # 워크스페이스 컨테이너의 `run_tests` 가 부르는 실행 파일이다. 개발 의존성이
  # 아니라 도구 서버의 런타임 의존성이다 — `dev` extra 에만 두면 이미지에
  # 들어가지 않아 QA 가 매번 "pytest 가 설치되지 않았습니다" 로 FAIL 한다
  # (실측: 3회차 전부 그 사유로 반려, 모델이 아니라 인프라 탓이었다).
  # `bandit` 이 여기 있는 것과 같은 이유다.
  "pytest>=8.3",
  "mcp>=2.2.0,<3.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "websockets>=13.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["packages", "services"]

[tool.setuptools.packages.find]
where = ["packages"]
